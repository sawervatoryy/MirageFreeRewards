# ============================================================
#  MirageFreeRewards v0.1.1 — главная конфигурация
#  v0.1.1: требования по наигранному времени (%statistic_hours_played%)
#          и расширенная анимация открытия меню.
#  Paper 1.21.4+ | Java 21+
# ============================================================
#  Вся визуальная часть вынесена в menus/*.yml,
#  награды — в rewards.yml, тексты — в messages.yml.
#  Этот файл отвечает за поведение, тему и интеграции.
# ============================================================

# Версия конфигурации.
config-version: 1

settings:
  # Меню, которое открывается командой /free без аргументов.
  default-menu: "free"

  # Название сервера для плейсхолдера {server}.
  server-name: "Mirage"

  # Антиспам на открытие меню (миллисекунды). 0 — отключить.
  open-cooldown-ms: 750

  # Антиспам на получение наград (миллисекунды). 0 — отключить.
  claim-cooldown-ms: 350

  # Как часто обновлять открытые меню (в тиках): 20 = раз в секунду.
  # Нужно для живого обратного отсчёта кулдаунов. 0 — не обновлять.
  refresh-interval: 20

  # Закрывать меню после успешного получения награды.
  close-on-claim: false

  # Подробные сообщения в консоль (выдача, перезагрузка, ошибки).
  debug: false

  # Миры, в которых /free не работает. Пример: ["world_nether", "world_the_end"]
  disabled-worlds: []

  # Форматы даты и времени для плейсхолдеров {date} и {time}.
  date-format: "dd.MM.yyyy HH:mm"
  time-format: "HH:mm:ss"

  # Часовой пояс для сброса периодов (daily/weekly/monthly).
  timezone: "Asia/Yekaterinburg"

  # Звуки интерфейса. Можно указать секцией или строкой "key;volume;pitch".
  click-sound:
    key: "ui.button.click"
    volume: 0.35
    pitch: 1.2
  default-claim-sound:
    key: "entity.player.levelup"
    volume: 0.7
    pitch: 1.15
  error-sound:
    key: "block.note_block.bass"
    volume: 0.6
    pitch: 0.8

  hooks:
    # Мягкая интеграция: если PlaceholderAPI не установлен, плагин всё равно работает.
    placeholderapi: true

# ============================================================
#  ТЕМА ОФОРМЛЕНИЯ
# ============================================================
#  Цвета взяты из референса: насыщенный красный, тёмно-красный,
#  алый, тёмно-синий фон и белый как основной цвет текста.
#  В любом тексте можно писать {base}, {primary}, {secondary},
#  {dark}, {background}, {surface}, {accent}, {muted}.
#  Чтобы полностью сменить оформление — измените эти 8 значений.
# ============================================================
theme:
  base: "#FFFFFF"          # основной текст
  primary: "#F72B2B"       # яркий алый акцент
  secondary: "#EE3F3F"     # красный
  dark: "#B33535"          # тёмно-красный
  background: "#161C27"    # тёмный фон интерфейса
  surface: "#1E2635"       # панели и подложки
  accent: "#2F80ED"        # синий акцент (выделение)
  muted: "#9AA6B8"         # приглушённый серый текст
